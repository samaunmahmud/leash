# Render Blueprint: the Leash web service (Docker) and its Postgres.
# Render → New → Blueprint → this repo. Fill the "sync: false" values in the dashboard when asked.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: leash
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      # Leash turns Render's postgres:// URL into JDBC itself (DatabaseUrl).
      - key: DATABASE_URL
        fromDatabase:
          name: leash-db
          property: connectionString
      # If the database stops answering (Render's free Postgres expires after 30 days), start on the in-memory one.
      - key: LEASH_DB_FALLBACK
        value: memory
      # The public demo: banner, hourly reset, rate limits, owner gate.
      - key: LEASH_DEMO_PUBLIC
        value: "true"
      - key: LEASH_OWNER_PASSPHRASE
        sync: false
      - key: LEASH_DEV_ENDPOINTS
        value: "false"
      # PayPal: sandbox only.
      - key: LEASH_PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: LEASH_PAYPAL_CLIENT_ID
        sync: false
      - key: LEASH_PAYPAL_CLIENT_SECRET
        sync: false
      - key: LEASH_PAYPAL_WEBHOOK_ID
        sync: false
      # AI (OpenAI-compatible). Empty key = rule-based checks only.
      - key: LEASH_LLM_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: LEASH_LLM_API_KEY
        sync: false
      - key: LEASH_LLM_MODEL
        value: gemini-3.5-flash-lite
      - key: LEASH_LLM_REASONING_EFFORT
        value: minimal
      - key: LEASH_LLM_MAX_CALLS_PER_DAY
        value: "20"

databases:
  - name: leash-db
    plan: free
    region: frankfurt
    databaseName: leash
    user: leash
