# Test overrides. classpath:/config/ beats classpath:/application.yml, so these win over values from a real .env:
# tests must never reach the real PayPal or LLM APIs. Tests that need PayPal point base-url at FakePayPalServer.
leash.paypal.base-url=http://localhost:9
leash.paypal.client-id=
leash.paypal.client-secret=
leash.paypal.payee-email=
leash.paypal.webhook-id=
leash.llm.base-url=
leash.llm.api-key=
leash.llm.model=
# A fresh in-memory database per Spring context.
spring.datasource.url=jdbc:h2:mem:test-${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
# Older REST tests predate agent keys and post purchases without one. Agent-key auth on REST is tested on its own
# (AgentKeyAuthTest turns this back on); /mcp always requires a key.
leash.agent-auth.rest=false
