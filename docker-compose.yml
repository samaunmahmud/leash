# Local Postgres for Leash. Start it with `docker compose up -d`, then set LEASH_DB_URL in .env (see .env.example).
# Data lives in the named volume, so it survives restarts of both the database and the backend.
# `docker compose down -v` wipes it.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: leash
      POSTGRES_USER: leash
      POSTGRES_PASSWORD: ${LEASH_DB_PASSWORD:-leash}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - leash-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leash -d leash"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  leash-pg:
