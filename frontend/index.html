<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf7f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e0a0c" media="(prefers-color-scheme: dark)" />
    <script>
      // Apply a saved theme before first paint so a returning visitor never sees the other one flash.
      try {
        var t = localStorage.getItem("leash-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Leash · Spending limits for AI agents</title>
    <meta name="description" content="Let your agents shop. Keep them on a leash. Spending limits for AI agents, enforced through PayPal." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
